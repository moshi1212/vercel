<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 网站配置工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f0f1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }
        
        .panel {
            background: #1a1a2e;
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 560px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        
        h1 { font-size: 22px; margin-bottom: 8px; }
        .subtitle { color: #888; font-size: 13px; margin-bottom: 28px; }
        
        .section { margin-bottom: 24px; }
        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            margin-bottom: 12px;
        }
        
        label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 6px;
        }
        
        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            background: #252540;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 12px 14px;
            color: #fff;
            font-size: 14px;
            transition: border 0.2s;
            outline: none;
        }
        input:focus, textarea:focus {
            border-color: #6366f1;
        }
        textarea { resize: vertical; min-height: 80px; font-family: inherit; }
        
        .row { display: flex; gap: 12px; }
        .row .field { flex: 1; }
        
        /* 颜色选择 */
        .color-picker-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        input[type="color"] {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            padding: 4px;
            background: #252540;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 8px; }
        
        .preset-colors {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .preset-color {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .preset-color:hover { transform: scale(1.15); }
        .preset-color.active { border-color: #fff; }
        
        .color-hex {
            font-size: 14px;
            color: #888;
            font-family: monospace;
        }
        
        /* 预览 */
        .preview-box {
            background: #252540;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .preview-label { font-size: 11px; color: #666; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        
        .preview-btn {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: default;
            transition: all 0.3s;
        }
        .preview-btn.primary {
            color: #fff;
            border: none;
        }
        .preview-btn.secondary {
            background: transparent;
            border: 1px solid currentColor;
        }
        
        /* 保存按钮 */
        .save-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }
        .save-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .save-btn:active { transform: translateY(0); }
        .save-btn.saving { opacity: 0.6; pointer-events: none; }
        
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #22c55e;
            color: #fff;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.3s ease;
            z-index: 999;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.error { background: #ef4444; }
        
        .tip {
            font-size: 12px;
            color: #555;
            margin-top: 4px;
        }
        
        .divider {
            height: 1px;
            background: #2a2a40;
            margin: 24px 0;
        }
    </style>
</head>
<body>

<div class="panel">
    <h1>🎨 网站配置工具</h1>
    <p class="subtitle">实时预览 · 改完点保存即可生效</p>
    
    <!-- 实时预览 -->
    <div class="preview-box">
        <div class="preview-label">⬡ 实时预览</div>
        <button class="preview-btn primary" id="previewPrimary">验证卡密</button>
        <button class="preview-btn secondary" id="previewSecondary" style="margin-left:8px">联系客服</button>
    </div>
    
    <!-- 联系信息 -->
    <div class="section">
        <div class="section-title">📞 联系信息</div>
        <div class="row">
            <div class="field">
                <label>微信号</label>
                <input type="text" id="wechat" placeholder="填写微信号">
            </div>
            <div class="field">
                <label>邮箱</label>
                <input type="email" id="email" placeholder="your@email.com">
            </div>
        </div>
        <div style="margin-top:12px">
            <label>微信公众号 / 其他链接</label>
            <input type="text" id="otherLink" placeholder="如：微信公众号名称，或 Telegram @xxx">
        </div>
        <div style="margin-top:12px">
            <label>联系说明文字</label>
            <textarea id="contactText" placeholder="如：添加时请备注'卡密'，24小时内回复"></textarea>
        </div>
    </div>
    
    <div class="divider"></div>
    
    <!-- 颜色配置 -->
    <div class="section">
        <div class="section-title">🎨 主题颜色</div>
        <label>选择颜色</label>
        <div class="color-picker-wrap" style="margin-top:8px">
            <input type="color" id="colorPicker" value="#6366f1">
            <span class="color-hex" id="colorHex">#6366f1</span>
        </div>
        <div class="preset-colors" style="margin-top:12px" id="presetColors"></div>
    </div>
    
    <div class="divider"></div>
    
    <!-- 标题配置 -->
    <div class="section">
        <div class="section-title">📝 网站标题</div>
        <div>
            <label>页面标题</label>
            <input type="text" id="siteTitle" placeholder="卡密验证系统">
        </div>
        <div style="margin-top:12px">
            <label>副标题 / 说明文字</label>
            <input type="text" id="siteSubtitle" placeholder="如：付费工具专用通道">
        </div>
    </div>
    
    <button class="save-btn" id="saveBtn" onclick="save()">💾 保存配置</button>
    <p class="tip" style="text-align:center;margin-top:10px">保存后需手动复制配置到 Vercel（详见下方说明）</p>
</div>

<div class="toast" id="toast"></div>

<script>
const PRESET_COLORS = [
    '#6366f1', '#8b5cf6', '#ec4899', '#ef4444',
    '#f97316', '#eab308', '#22c55e', '#14b8a6',
    '#06b6d4', '#3b82f6', '#1e293b', '#0f172a'
];

// 加载已有配置
const saved = JSON.parse(localStorage.getItem('site_config') || '{}');

function $(id) { return document.getElementById(id); }

function setVal(id, val) {
    if (val) $(id).value = val;
}

setVal('wechat', saved.wechat);
setVal('email', saved.email);
setVal('otherLink', saved.otherLink);
setVal('contactText', saved.contactText);
setVal('siteTitle', saved.siteTitle);
setVal('siteSubtitle', saved.siteSubtitle);

let currentColor = saved.color || '#6366f1';
$('colorPicker').value = currentColor;
$('colorHex').textContent = currentColor;
updatePreview();

// 渲染预设颜色
PRESET_COLORS.forEach(c => {
    const btn = document.createElement('div');
    btn.className = 'preset-color' + (c === currentColor ? ' active' : '');
    btn.style.background = c;
    btn.onclick = () => setColor(c);
    $('presetColors').appendChild(btn);
});

function setColor(c) {
    currentColor = c;
    $('colorPicker').value = c;
    $('colorHex').textContent = c;
    document.querySelectorAll('.preset-color').forEach(el => {
        el.classList.toggle('active', el.style.background === c || rgbToHex(el.style.background) === c);
    });
    updatePreview();
}

function rgbToHex(rgb) {
    if (!rgb || !rgb.startsWith('rgb')) return rgb;
    const m = rgb.match(/\d+/g);
    if (!m) return rgb;
    return '#' + m.slice(0,3).map(v => parseInt(v).toString(16).padStart(2,'0')).join('');
}

$('colorPicker').addEventListener('input', e => {
    setColor(e.target.value);
});

function updatePreview() {
    const hex = currentColor;
    const btn = $('previewPrimary');
    btn.style.background = hex;
    
    const secondary = $('previewSecondary');
    secondary.style.color = hex;
    secondary.style.borderColor = hex;
    
    // 标题预览
    const titleEl = document.querySelector('.panel h1');
    if ($('siteTitle').value) {
        titleEl.textContent = '🎨 ' + $('siteTitle').value;
    }
}

$('siteTitle').addEventListener('input', updatePreview);

function showToast(msg, err) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast' + (err ? ' error' : '');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
}

function save() {
    const config = {
        wechat: $('wechat').value.trim(),
        email: $('email').value.trim(),
        otherLink: $('otherLink').value.trim(),
        contactText: $('contactText').value.trim(),
        siteTitle: $('siteTitle').value.trim(),
        siteSubtitle: $('siteSubtitle').value.trim(),
        color: currentColor
    };
    
    localStorage.setItem('site_config', JSON.stringify(config));
    showToast('✅ 本地保存成功！');
    
    // 生成部署代码
    generateDeployCode(config);
}

function generateDeployCode(config) {
    const bgBrightness = hexToRgb(currentColor);
    
    const html = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${config.siteTitle || '卡密验证系统'}</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --primary: ${currentColor};
            --primary-dark: ${adjustColor(currentColor, -20)};
            --primary-light: ${adjustColor(currentColor, 20)};
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 ${config.siteTitle || '卡密验证系统'}</h1>
        ${config.siteSubtitle ? `<p class="subtitle">${config.siteSubtitle}</p>` : ''}
        
        <div class="card">
            <h2>验证卡密</h2>
            <div class="form-group">
                <label for="phone">手机号</label>
                <input type="tel" id="phone" placeholder="请输入11位手机号" maxlength="11">
            </div>
            <div class="form-group">
                <label for="license">卡密</label>
                <input type="text" id="license" placeholder="请输入10位卡密" maxlength="10">
            </div>
            <button id="verifyBtn" class="btn-primary">验证卡密</button>
            <div id="message" class="message"></div>
        </div>

        <div class="card">
            <h2>获取卡密</h2>
            <p>${config.contactText || '如需购买卡密，请联系客服：'}</p>
            <div class="contact-info">
                ${config.wechat ? `<p>📱 微信：${config.wechat}</p>` : ''}
                ${config.email ? `<p>📧 邮箱：${config.email}</p>` : ''}
                ${config.otherLink ? `<p>🔗 ${config.otherLink}</p>` : ''}
            </div>
            <button id="contactBtn" class="btn-secondary">联系客服</button>
        </div>

        <div class="footer">
            <a href="admin.html" class="admin-link">管理后台</a>
        </div>
    </div>

    <script src="script.js"><\/script>
</body>
</html>`;
    
    // 复制到剪贴板
    navigator.clipboard.writeText(html).then(() => {
        showToast('📋 index.html 已复制到剪贴板！去 Vercel 替换 index.html 文件');
    }).catch(() => {
        // Fallback
        const ta = document.createElement('textarea');
        ta.value = html;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('📋 index.html 已复制到剪贴板！');
    });
}

function hexToRgb(hex) {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    return {r, g, b};
}

function adjustColor(hex, amount) {
    const {r, g, b} = hexToRgb(hex);
    const adj = (v) => Math.max(0, Math.min(255, v + amount));
    return '#' + [adj(r), adj(g), adj(b)].map(v => v.toString(16).padStart(2,'0')).join('');
}
</script>
</body>
</html>
