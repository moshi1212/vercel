<!DOCTYPE html>
<html lang="zh-CN">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>PixelBead 像素拼豆工坊 | 一键高清拼豆图纸生成器</title>
 <link rel="stylesheet" href="main.css">
</head>
<body>
 <!-- 顶部导航 -->
 <header class="header">
 <div class="header-left">
 <div class="logo">
 <span class="logo-icon">🧶</span>
 <div class="logo-text">
 <span class="logo-title">PixelBead</span>
 <span class="logo-subtitle">像素拼豆工坊</span>
 </div>
 </div>
 </div>
 <div class="header-center">
 <!-- 预设规格快捷按钮 -->
 <div class="preset-grid">
 <button class="preset-btn" onclick="setPresetGrid(16)">16×16</button>
 <button class="preset-btn" onclick="setPresetGrid(29)">29×29</button>
 <button class="preset-btn active" onclick="setPresetGrid(52)">52×52</button>
 <button class="preset-btn" onclick="setPresetGrid(104)">104×104</button>
 </div>
 <!-- 变形工具 -->
 <div class="transform-tools">
 <button class="nav-btn small" onclick="rotateCanvas(90)" title="顺时针旋转90°">↻90°</button>
 <button class="nav-btn small" onclick="rotateCanvas(180)" title="旋转180°">↺180°</button>
 <button class="nav-btn small" onclick="flipCanvas('h')" title="水平镜像">⇄</button>
 <button class="nav-btn small" onclick="flipCanvas('v')" title="垂直镜像">⇅</button>
 </div>
 </div>
 <div class="header-right">
 <button class="nav-btn" onclick="saveProject()">💾 保存</button>
 <button class="nav-btn" onclick="loadProject()">📂 打开</button>
 <button class="nav-btn" onclick="exportExcel()">📊 物料清单</button>
 <button class="nav-btn" onclick="showHistory()">📋 历史</button>
 <button class="nav-btn" onclick="downloadImage()">💾 PNG</button>
 <button class="nav-btn btn-primary-small" onclick="downloadPDF()">📄 PDF</button>
 </div>
 </header>

 <!-- 主内容区 -->
 <main class="main-content">
 <!-- 底部状态栏（坐标+提示） -->
 <div class="status-bar" id="statusBar">
 <span id="cursorPos">坐标: --</span>
 <span id="hoverColor">颜色: --</span>
 <span id="statusTip">上传图片开始创作</span>
 </div>

 <div class="content-wrapper">
 <!-- 左侧面板 -->
 <div class="left-panel">
 <!-- 主区域：上传区+画布（占据剩余空间） -->
 <div class="left-main">
 <!-- 上传区 -->
 <div class="upload-zone" id="uploadZone">
 <div class="upload-content">
 <div class="upload-icon">📤</div>
 <h3>上传图片开始生成</h3>
 <p>支持 JPG / PNG / WEBP，点击或拖拽上传</p>
 </div>
 <input type="file" id="fileInput" accept="image/*" hidden>
 </div>

 <!-- 画布编辑器 -->
 <div class="canvas-editor hidden" id="canvasEditor">
 <div class="canvas-wrapper" id="canvasWrapper">
 <canvas id="mainCanvas"></canvas>
 </div>
 </div>
 </div><!-- end left-main -->

 <!-- 工具栏（画布正下方） -->
 <div class="toolbar-area hidden" id="toolbarArea">
 <div class="tool-group">
 <button class="tool-btn active" id="toolBrush" onclick="selectTool('brush')" title="像素画笔">
 <span class="tool-icon">✏️</span>
 <span class="tool-label">画笔</span>
 </button>
 <button class="tool-btn" id="toolEraser" onclick="selectTool('eraser')" title="橡皮擦">
 <span class="tool-icon">🧹</span>
 <span class="tool-label">橡皮</span>
 </button>
 <button class="tool-btn" id="toolPicker" onclick="selectTool('picker')" title="取色器">
 <span class="tool-icon">💉</span>
 <span class="tool-label">取色</span>
 </button>
 <button class="tool-btn" id="toolFill" onclick="selectTool('fill')" title="填充">
 <span class="tool-icon">🪣</span>
 <span class="tool-label">填充</span>
 </button>
 <button class="tool-btn" id="toolWand" onclick="selectTool('wand')" title="魔棒（批量替换颜色）">
 <span class="tool-icon">🪄</span>
 <span class="tool-label">魔棒</span>
 </button>
 <button class="tool-btn" id="toolSelect" onclick="selectTool('select')" title="框选">
 <span class="tool-icon">⬚</span>
 <span class="tool-label">框选</span>
 </button>
 </div>
 <div class="tool-divider-v"></div>
 <div class="tool-group">
 <button class="tool-btn" onclick="undo()" title="撤销">
 <span class="tool-icon">↩️</span>
 <span class="tool-label">撤销</span>
 </button>
 <button class="tool-btn" onclick="redo()" title="重做">
 <span class="tool-icon">↪️</span>
 <span class="tool-label">重做</span>
 </button>
 </div>
 <div class="tool-divider-v"></div>
 <div class="tool-group">
 <button class="tool-btn" onclick="toggleGridLines()" title="显示/隐藏网格线" id="btnGrid">
 <span class="tool-icon">#</span>
 <span class="tool-label">网格</span>
 </button>
 <button class="tool-btn" onclick="toggleColorCode()" title="显示/隐藏色号" id="btnColorCode">
 <span class="tool-icon">A1</span>
 <span class="tool-label">色号</span>
 </button>
 <button class="tool-btn" onclick="toggleNumbers()" title="显示/隐藏行列号" id="btnNumbers">
 <span class="tool-icon">123</span>
 <span class="tool-label">编号</span>
 </button>
 <button class="tool-btn" onclick="toggleFullscreen()" title="全屏预览">
 <span class="tool-icon">⛶</span>
 <span class="tool-label">全屏</span>
 </button>
 </div>
 <div class="tool-divider-v"></div>
 <div class="tool-group zoom-group">
 <button class="tool-btn" onclick="zoomCanvasIn()" title="放大">
 <span class="tool-icon">🔍+</span>
 <span class="tool-label">放大</span>
 </button>
 <button class="tool-btn" onclick="zoomCanvasOut()" title="缩小">
 <span class="tool-icon">🔍-</span>
 <span class="tool-label">缩小</span>
 </button>
 <button class="tool-btn" onclick="zoomCanvasFit()" title="适应窗口">
 <span class="tool-icon">⊡</span>
 <span class="tool-label">适应</span>
 </button>
