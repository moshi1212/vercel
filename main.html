<!DOCTYPE html>
<html lang="zh-CN">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>PixelBead 像素拼豆工坊 | 一键高清拼豆图纸生成器</title>
 <link rel="stylesheet" href="main.css">
</head>
<body>
 <!-- 顶部导航 -->
 <header class="header">
 <div class="header-left">
 <div class="logo">
 <span class="logo-icon">🧶</span>
 <div class="logo-text">
 <span class="logo-title">PixelBead</span>
 <span class="logo-subtitle">像素拼豆工坊</span>
 </div>
 </div>
 </div>
 <div class="header-center">
 <div class="preset-grid">
 <button class="preset-btn" onclick="setPresetGrid(16)">16×16</button>
 <button class="preset-btn" onclick="setPresetGrid(29)">29×29</button>
 <button class="preset-btn active" onclick="setPresetGrid(52)">52×52</button>
 <button class="preset-btn" onclick="setPresetGrid(104)">104×104</button>
 </div>
 <div class="transform-tools">
 <button class="nav-btn small" onclick="rotateCanvas(90)" title="顺时针旋转90°">↻90°</button>
 <button class="nav-btn small" onclick="rotateCanvas(180)" title="旋转180°">↺180°</button>
 <button class="nav-btn small" onclick="flipCanvas('h')" title="水平镜像">⇄</button>
 <button class="nav-btn small" onclick="flipCanvas('v')" title="垂直镜像">⇅</button>
 </div>
 </div>
 <div class="header-right">
 <button class="nav-btn" onclick="saveProject()">💾 保存</button>
 <button class="nav-btn" onclick="loadProject()">📂 打开</button>
 <button class="nav-btn" onclick="exportExcel()">📊 物料清单</button>
 <button class="nav-btn" onclick="showHistory()">📋 历史</button>
 <button class="nav-btn" onclick="downloadImage()">💾 PNG</button>
 <button class="nav-btn btn-primary-small" onclick="downloadPDF()">📄 PDF</button>
 </div>
 </header>

 <main class="main-content">
 <div class="status-bar" id="statusBar">
 <span id="cursorPos">坐标: --</span>
 <span id="hoverColor">颜色: --</span>
 <span id="statusTip">上传图片开始创作</span>
 </div>

 <div class="content-wrapper">
 <!-- 左侧：画布区域 -->
 <div class="left-panel">
 <div class="upload-zone" id="uploadZone">
 <div class="upload-content">
 <div class="upload-icon">📤</div>
 <h3>上传图片开始生成</h3>
 <p>支持 JPG / PNG / WEBP，点击或拖拽上传</p>
 </div>
 <input type="file" id="fileInput" accept="image/*" hidden>
 </div>
 <div class="canvas-editor hidden" id="canvasEditor">
 <div class="canvas-wrapper" id="canvasWrapper">
 <canvas id="mainCanvas"></canvas>
 </div>
 </div>
 </div>

 <!-- 右侧：控制面板 -->
 <div class="sidebar">
 <div class="sidebar-card">
 <h3>🧶 珠子品牌</h3>
 <div class="brand-grid">
 <button class="brand-btn active" data-brand="MARD" onclick="setBrand('MARD')">MARD</button>
 <button class="brand-btn" data-brand="MARD_FULL" onclick="setBrand('MARD_FULL')" title="220色全色库">MARD 220色</button>
 <button class="brand-btn" data-brand="Perler" onclick="setBrand('Perler')">Perler</button>
 <button class="brand-btn" data-brand="Hama" onclick="setBrand('Hama')">Hama</button>
 <button class="brand-btn" data-brand="Artkal" onclick="setBrand('Artkal')">Artkal</button>
 </div>
 </div>
 <div class="sidebar-card">
 <h3>⚙️ 网格设置</h3>
 <div class="param-item">
 <div class="param-label"><span>宽度</span><span class="param-value" id="gridWValue">52</span></div>
 <input type="range" id="gridW" min="5" max="300" value="52" class="param-slider">
 </div>
 <div class="param-item">
 <div class="param-label"><span>高度</span><span class="param-value" id="gridHValue">52</span></div>
 <input type="range" id="gridH" min="5" max="300" value="52" class="param-slider">
 </div>
 <div class="param-item">
 <div class="param-label">
 <span>锁定宽高比</span>
 <label class="toggle-switch">
 <input type="checkbox" id="lockRatio" checked>
 <span class="toggle-slider"></span>
 </label>
 </div>
 </div>
 </div>
 <div class="sidebar-card">
 <h3>🎨 颜色控制</h3>
 <div class="param-item">
 <div class="param-label"><span>最大颜色数</span><span class="param-value" id="colorLimitValue">24</span></div>
 <input type="range" id="colorLimit" min="2" max="60" value="24" class="param-slider">
 </div>
 <div class="param-item">
 <div class="param-label">
 <span>白色区域留白</span>
 <label class="toggle-switch">
 <input type="checkbox" id="keepWhite" checked>
 <span class="toggle-slider"></span>
 </label>
 </div>
 </div>
 <div class="param-item">
 <div class="param-label">
 <span>降噪（消除单点杂色）</span>
 <label class="toggle-switch">
 <input type="checkbox" id="noiseReduction" checked>
 <span class="toggle-slider"></span>
 </label>
 </div>
 </div>
 </div>
 <div class="sidebar-card">
 <h3>🖼️ 图像预处理</h3>
 <div class="param-item">
 <div class="param-label"><span>亮度</span><span class="param-value" id="brightnessValue">100%</span></div>
 <input type="range" id="brightness" min="50" max="150" value="100" class="param-slider">
 </div>
 <div class="param-item">
 <div class="param-label"><span>对比度</span><span class="param-value" id="contrastValue">100%</span></div>
 <input type="range" id="contrast" min="50" max="150" value="100" class="param-slider">
 </div>
 <div class="param-item">
 <div class="param-label"><span>饱和度</span><span class="param-value" id="saturationValue">100%</span></div>
 <input type="range" id="saturation" min="0" max="200" value="100" class="param-slider">
 </div>
 <button class="btn-reset" onclick="resetAdjustments()">↺ 重置</button>
 </div>
 <div class="sidebar-card action-card">
 <button class="btn-generate" onclick="generatePerlerBeads()">🧶 一键高清生成</button>
 </div>
 <div class="sidebar-card">
