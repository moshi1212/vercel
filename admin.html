<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 卡密系统</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>⚙️ 管理后台</h1>

        <!-- 登录界面 -->
        <div id="loginSection" class="card login-form">
            <h2>管理员登录</h2>
            <div class="form-group">
                <label for="adminPassword">密码</label>
                <input type="password" id="adminPassword" placeholder="请输入管理密码">
            </div>
            <button id="loginBtn" class="btn-primary">登录</button>
            <div id="loginMessage" class="message"></div>
        </div>

        <!-- 管理界面 -->
        <div id="adminSection" class="hidden">
            <div class="card">
                <div class="admin-header">
                    <h2>数据统计</h2>
                    <button id="logoutBtn" class="btn-secondary">退出登录</button>
                </div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>总卡密数</h3>
                        <div id="totalKeys" class="number">0</div>
                    </div>
                    <div class="stat-card">
                        <h3>已使用</h3>
                        <div id="usedKeys" class="number">0</div>
                    </div>
                    <div class="stat-card">
                        <h3>未使用</h3>
                        <div id="activeKeys" class="number">0</div>
                    </div>
                    <div class="stat-card">
                        <h3>今日验证</h3>
                        <div id="todayVerifications" class="number">0</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="admin-header">
                    <h2>卡密管理</h2>
                    <div>
                        <input type="number" id="generateCount" value="10" min="1" max="100" style="width: 80px; padding: 8px; border-radius: 4px; border: 1px solid #ddd;">
                        <button id="generateBtn" class="btn-generate">批量生成</button>
                    </div>
                </div>
                <div id="keyList" class="key-list">
                    <!-- 卡密列表将在这里显示 -->
                </div>
            </div>
        </div>

        <div class="footer">
            <a href="index.html" class="admin-link">返回首页</a>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        const ADMIN_PASSWORD = 'admin123'; // 默认密码，建议修改

        const loginSection = document.getElementById('loginSection');
        const adminSection = document.getElementById('adminSection');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const generateBtn = document.getElementById('generateBtn');
        const loginMessage = document.getElementById('loginMessage');

        // 登录
        loginBtn.addEventListener('click', () => {
            const password = document.getElementById('adminPassword').value;
            if (password === ADMIN_PASSWORD) {
                sessionStorage.setItem('admin_logged_in', 'true');
                showAdminPanel();
            } else {
                loginMessage.textContent = '密码错误';
                loginMessage.className = 'message error';
            }
        });

        // 退出
        logoutBtn.addEventListener('click', () => {
            sessionStorage.removeItem('admin_logged_in');
            location.reload();
        });

        // 显示管理面板
        function showAdminPanel() {
            loginSection.classList.add('hidden');
            adminSection.classList.remove('hidden');
            loadStats();
            loadKeys();
        }

        // 加载统计
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/stats`);
                const data = await response.json();
                document.getElementById('totalKeys').textContent = data.total || 0;
                document.getElementById('usedKeys').textContent = data.used || 0;
                document.getElementById('activeKeys').textContent = data.active || 0;
                document.getElementById('todayVerifications').textContent = data.today || 0;
            } catch (error) {
                console.error('加载统计失败:', error);
            }
        }

        // 加载卡密列表
        async function loadKeys() {
            try {
                const response = await fetch(`${API_BASE}/keys`);
                const data = await response.json();
                const keyList = document.getElementById('keyList');
                
                if (data.keys && data.keys.length > 0) {
                    keyList.innerHTML = data.keys.map(key => `
                        <div class="key-item">
                            <span class="key-code">${key.code}</span>
                            <span class="key-status ${key.used ? 'used' : 'active'}">
                                ${key.used ? '已使用' : '未使用'}
                            </span>
                        </div>
                    `).join('');
                } else {
                    keyList.innerHTML = '<p style="text-align: center; color: #999; padding: 20px;">暂无卡密</p>';
                }
            } catch (error) {
                console.error('加载卡密失败:', error);
            }
        }

        // 生成卡密
        generateBtn.addEventListener('click', async () => {
            const count = parseInt(document.getElementById('generateCount').value) || 10;
            generateBtn.disabled = true;
            generateBtn.textContent = '生成中...';

            try {
                const response = await fetch(`${API_BASE}/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ count })
                });

                const data = await response.json();
                if (data.success) {
                    alert(`成功生成 ${data.keys.length} 个卡密`);
                    loadStats();
                    loadKeys();
                } else {
                    alert('生成失败: ' + data.message);
                }
            } catch (error) {
                alert('生成失败，请稍后重试');
            } finally {
                generateBtn.disabled = false;
                generateBtn.textContent = '批量生成';
            }
        });

        // 检查登录状态
        if (sessionStorage.getItem('admin_logged_in') === 'true') {
            showAdminPanel();
        }
    </script>
</body>
</html>
