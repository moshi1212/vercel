<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡密管理后台 | 草莓拼豆</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }
        
        .admin-header {
            background: #fff;
            padding: 24px;
            border-radius: 8px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        
        .admin-header h1 {
            font-size: 20px;
            margin-bottom: 8px;
        }
        
        .admin-header p {
            color: #666;
            font-size: 14px;
        }
        
        .admin-section {
            background: #fff;
            padding: 24px;
            border-radius: 8px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        
        .admin-section h2 {
            font-size: 16px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }
        
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #333;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .btn-generate {
            background: #52c41a;
            color: #fff;
            border: none;
            padding: 12px 32px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .btn-generate:hover {
            background: #73d13d;
        }
        
        .generated-keys {
            margin-top: 20px;
            padding: 16px;
            background: #f6ffed;
            border: 1px solid #b7eb8f;
            border-radius: 6px;
        }
        
        .generated-keys h3 {
            font-size: 14px;
            margin-bottom: 12px;
            color: #389e0d;
        }
        
        .key-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .key-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: #fff;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
        }
        
        .key-item button {
            padding: 4px 12px;
            background: #1890ff;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
        }
        
        .stat-card {
            text-align: center;
            padding: 20px;
            background: #f8f8f8;
            border-radius: 6px;
        }
        
        .stat-card .number {
            font-size: 28px;
            font-weight: 600;
            color: #1890ff;
        }
        
        .stat-card .label {
            font-size: 13px;
            color: #666;
            margin-top: 4px;
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #1890ff;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 16px;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        .login-form {
            max-width: 400px;
            margin: 100px auto;
            background: #fff;
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
        }
        
        .login-form h2 {
            text-align: center;
            margin-bottom: 24px;
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- 登录页面 -->
    <div id="loginPage" class="login-form">
        <h2>🔐 管理后台登录</h2>
        <div class="form-group" style="margin-bottom: 16px;">
            <label>管理员密码</label>
            <input type="password" id="adminPassword" placeholder="请输入密码">
        </div>
        <button class="btn-generate" style="width: 100%;" onclick="doLogin()">登录</button>
        <p style="text-align: center; margin-top: 16px; font-size: 12px; color: #999;">
            默认密码: admin123 (请尽快修改)
        </p>
    </div>
    
    <!-- 管理后台 -->
    <div id="adminPage" class="hidden">
        <div class="admin-container">
            <a href="index.html" class="back-link">← 返回首页</a>
            
            <div class="admin-header">
                <h1>🍓 草莓拼豆 - 卡密管理后台</h1>
                <p>生成、管理和查看卡密使用情况</p>
            </div>
            
            <!-- 统计 -->
            <div class="admin-section">
                <h2>📊 数据统计</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="number" id="totalKeys">-</div>
                        <div class="label">总卡密数</div>
                    </div>
                    <div class="stat-card">
                        <div class="number" id="usedKeys">-</div>
                        <div class="label">已使用</div>
                    </div>
                    <div class="stat-card">
                        <div class="number" id="availableKeys">-</div>
                        <div class="label">未使用</div>
                    </div>
                </div>
                <button class="btn-secondary" style="margin-top: 16px;" onclick="loadStats()">刷新数据</button>
            </div>
            
            <!-- 生成卡密 -->
            <div class="admin-section">
                <h2>🔑 生成卡密</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label>生成数量</label>
                        <input type="number" id="keyCount" value="5" min="1" max="100">
                    </div>
                    <div class="form-group">
                        <label>有效期</label>
                        <select id="keyDuration">
                            <option value="86400000">1天</option>
                            <option value="604800000">7天</option>
                            <option value="2592000000" selected>30天</option>
                            <option value="7776000000">90天</option>
                            <option value="31536000000">365天</option>
                            <option value="0">永久</option>
                        </select>
                    </div>
                </div>
                <button class="btn-generate" onclick="generateKeys()">生成卡密</button>
                
                <div id="generatedResult" class="generated-keys hidden">
                    <h3>✅ 生成成功！请复制保存：</h3>
                    <div class="key-list" id="keyList"></div>
                    <button class="btn-secondary" style="margin-top: 12px;" onclick="copyAllKeys()">复制全部</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = '/api';
        const ADMIN_PASSWORD = 'admin123'; // 建议修改
        
        let generatedKeys = [];
        
        function doLogin() {
            const password = document.getElementById('adminPassword').value;
            if (password === ADMIN_PASSWORD) {
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('adminPage').classList.remove('hidden');
                loadStats();
            } else {
                alert('密码错误');
            }
        }
        
        // 回车登录
        document.getElementById('adminPassword')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') doLogin();
        });
        
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/stats`);
                const data = await response.json();
                
                document.getElementById('totalKeys').textContent = data.total || 0;
                document.getElementById('usedKeys').textContent = data.used || 0;
                document.getElementById('availableKeys').textContent = data.available || 0;
            } catch (error) {
                console.error('加载统计失败:', error);
            }
        }
        
        function generateKeys() {
            const count = parseInt(document.getElementById('keyCount').value) || 5;
            const duration = parseInt(document.getElementById('keyDuration').value) || 2592000000;
            
            generatedKeys = [];
            for (let i = 0; i < count; i++) {
                generatedKeys.push(generateKey());
            }
            
            // 显示结果
            const resultDiv = document.getElementById('generatedResult');
            const listDiv = document.getElementById('keyList');
            
            listDiv.innerHTML = generatedKeys.map(key => `
                <div class="key-item">
                    <span>${key}</span>
                    <button onclick="copyKey('${key}')">复制</button>
                </div>
            `).join('');
            
            resultDiv.classList.remove('hidden');
            
            // 保存到服务器
            saveKeys(generatedKeys, duration);
        }
        
        function generateKey() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // 去掉易混淆字符
            let key = '';
            for (let i = 0; i < 10; i++) {
                key += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return key;
        }
        
        async function saveKeys(keys, duration) {
            try {
                await fetch(`${API_BASE}/create-keys`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ keys, duration })
                });
                loadStats();
            } catch (error) {
                console.error('保存失败:', error);
            }
        }
        
        function copyKey(key) {
            navigator.clipboard.writeText(key).then(() => {
                alert('已复制: ' + key);
            });
        }
        
        function copyAllKeys() {
            const text = generatedKeys.join('\n');
            navigator.clipboard.writeText(text).then(() => {
                alert('已复制全部 ' + generatedKeys.length + ' 个卡密');
            });
        }
    </script>
</body>
</html>
