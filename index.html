<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡密验证系统</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🔐 卡密验证系统</h1>
        
        <div class="card">
            <h2>验证卡密</h2>
            <div class="form-group">
                <label for="phone">手机号</label>
                <input type="tel" id="phone" placeholder="请输入11位手机号" maxlength="11">
            </div>
            <div class="form-group">
                <label for="license">卡密</label>
                <input type="text" id="license" placeholder="请输入10位卡密" maxlength="10">
            </div>
            <button id="verifyBtn" class="btn-primary">验证卡密</button>
            <div id="message" class="message"></div>
        </div>

        <div class="card">
            <h2>获取卡密</h2>
            <p>如需购买卡密，请联系客服：</p>
            <div class="contact-info">
                <p>📱 微信：kaxill</p>
                <p>📧 邮箱：617171856@qq.com</p>
            </div>
            <button id="contactBtn" class="btn-secondary">联系客服</button>
        </div>

        <div class="footer">
            <a href="admin.html" class="admin-link">管理后台</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
